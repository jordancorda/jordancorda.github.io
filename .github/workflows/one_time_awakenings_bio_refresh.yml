name: One-time Awakenings press kit biography refresh
on:
  push:
    paths:
      - '.github/workflows/one_time_awakenings_bio_refresh.yml'
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyMuPDF
        run: python -m pip install --disable-pip-version-check 'pymupdf==1.26.7'
      - name: Update IT and EN biography in press kit ZIP files
        run: python scripts/refresh_awakenings_presskit_bios_2026.py
      - name: Commit only the two updated press kit ZIP files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add press/awakenings-press-kit-it.zip press/awakenings-press-kit-en.zip
          git diff --cached --quiet || git commit -m "Update biography pages in Awakenings IT and EN press kits"
          git push
