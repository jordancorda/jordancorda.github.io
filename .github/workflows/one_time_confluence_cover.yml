name: One-time Confluence cover import
on:
  push:
    paths:
      - '.github/workflows/one_time_confluence_cover.yml'
jobs:
  import-cover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Retrieve official Confluence cover from album oEmbed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          album='https://open.spotify.com/album/1KLWu0q40lKBOyUV2NSN7G'
          api='https://open.spotify.com/oembed?url='+quote(album, safe='')
          request=Request(api,headers={'User-Agent':'Mozilla/5.0 (compatible; JordanCordaWebsite/1.0)'})
          with urlopen(request,timeout=30) as response:
              result=json.load(response)
          print('Spotify album title:',result.get('title'))
          if 'confluence' not in str(result.get('title','')).lower():
              raise RuntimeError('Unexpected album title; refusing to add a different cover')
          url=result['thumbnail_url']
          with urlopen(Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=30) as response:
              contents=response.read()
          if not contents.startswith(bytes.fromhex('ffd8ff')):
              raise RuntimeError('Album art was not a JPEG; refusing invalid file')
          if len(contents)<10000:
              raise RuntimeError('Album cover suspiciously small')
          path=Path('assets/covers/confluence-cover.jpg')
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_bytes(contents)
          print('Saved',str(path),len(contents),'bytes')
          PY
      - name: Commit album cover asset only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/covers/confluence-cover.jpg
          git diff --cached --quiet || git commit -m "Add Confluence by Small Clear album cover"
          git push
